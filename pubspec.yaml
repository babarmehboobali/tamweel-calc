name: tamweel_calc
description: Tamweel Calc – Loan eligibility, EMI, comparison and payoff planner for GCC users. All calculations on-device.
publish_to: 'none'
version: 1.0.0+13

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.2
  google_mobile_ads: ^9.2.0
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^13.3.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  http: ^1.6.0
  url_launcher: ^6.3.1
  fl_chart: ^1.3.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  in_app_review: ^2.0.12
  image_picker: ^1.2.4
  app_tracking_transparency: ^2.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/data/
    - assets/fonts/
    - assets/banks.json
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "#065F46"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/icon_monochrome.png"
  min_sdk_android: 23
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#065F46"

flutter_native_splash:
  color: "#065F46"
  image: assets/branding/splash_mark.png
  android_12:
    color: "#065F46"
    image: assets/branding/splash_mark.png
  android: true
  ios: true
